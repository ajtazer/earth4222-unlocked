<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff4e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1714" media="(prefers-color-scheme: dark)">
<title>Devices</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
<style>
  .row.tap { cursor: pointer; border-radius: 12px; }
  .detail { padding: 0 .25rem .75rem 3.875rem; color: var(--ink-2); font-size: .875rem; line-height: 1.6; }
  .empty { padding: 1rem .25rem; color: var(--ink-2); }
  .dn { font-weight: 600; }
  .row .tx small { white-space: normal; }
</style>
</head>
<body>
<header class="top"><div><h1>Devices</h1><p id="line"><span class="skel">loading</span></p></div></header>
<section class="card strip" aria-label="Bulb">
  <span class="lamp" id="lamp" aria-hidden="true"></span>
  <a class="tx" href="/bulb"><b id="bstate"><span class="skel">loading</span></b><small>Bulb · more controls</small></a>
  <button class="power sm" id="pwr" aria-label="Turn the bulb on or off" aria-pressed="false" disabled><svg class="i" viewBox="0 0 24 24"><path d="M12 3v8M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
</section>

<section class="card"><div class="list" id="list"><p class="empty">Looking for devices…</p></div></section>
<p class="note">Speeds are live Wi-Fi averages. Data counts from when each device joined. Wired devices show no usage figures.</p>
<nav class="tabs" aria-label="Sections">
  <a href="/"><svg class="i" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z"/></svg>Home</a>
  <a href="/bulb"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>Bulb</a>
  <a href="/devices" aria-current="page"><svg class="i" viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01"/></svg>Devices</a>
  <a href="/fibre"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>Fibre</a>
</nav>
<script>
const $ = id => document.getElementById(id);
// the router answers one request at a time and refuses others for ~0.2s, so retry briefly
async function api(q, tries = 10) {
  for (let i = 0; ; i++) {
    try { return await (await fetch("/api?a=" + q)).json(); }
    catch (e) { if (i >= tries) throw e; await new Promise(r => setTimeout(r, 200)); }
  }
}
// slider fill: action colour while the light is on, muted when it's off
const fill = (el, on = true) => el.style.setProperty("--track", `linear-gradient(90deg, ${on ? "var(--action)" : "var(--ink-3)"} ${(el.value - el.min) / (el.max - el.min) * 100}%, var(--well) 0)`);
const whiteName = k => k <= 3000 ? "Warm white" : k <= 4600 ? "Neutral white" : "Daylight";
const tempColor = k => { const t = (k - 2200) / 4300; const a = t < .42 ? [[255,154,60],[255,233,199],t/.42] : [[255,233,199],[227,237,255],(t-.42)/.58];
  return "rgb(" + a[0].map((v, i) => Math.round(v + (a[1][i] - v) * a[2])).join(",") + ")"; };
const lampColor = s => !s || !s.state ? "var(--well)" : s.r !== undefined && !s.temp ? `rgb(${s.r},${s.g},${s.b})` : tempColor(s.temp || 2700);
const lamp = (color, dim) => { $("lamp").style.setProperty("--lamp", color); $("lamp").style.filter = `brightness(${.8 + .2 * dim / 100})`; };
// compact bulb strip: the light stays one tap away on every page
function strip(s) {
  const on = !!(s && s.state);
  $("pwr").disabled = !s; $("pwr").classList.toggle("on", on); $("pwr").setAttribute("aria-pressed", on);
  $("bstate").textContent = !s ? "Bulb not responding" : !on ? "Light is off" : (s.sceneId ? "Scene" : s.temp ? whiteName(s.temp) : "Colour") + " · " + s.dimming + "%";
  lamp(lampColor(s), on ? s.dimming : 100);
}
async function loadStrip() { try { strip((await api("status")).result); } catch { strip(null); } }
$("pwr").onclick = async () => { $("pwr").classList.toggle("on"); try { await api("set&state=toggle"); } catch {} loadStrip(); };
loadStrip();

// device-type icons, same 1.75 line set as the rest of the app
const svg = d => `<svg class="i" viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const ICON = {
  phone:   svg("M8 3h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM11 18h2"),
  tablet:  svg("M6 3h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM11 18h2"),
  laptop:  svg("M5 6h14v10H5zM3 19h18"),
  desktop: svg("M3 5h18v11H3zM9 20h6M12 16v4"),
  tv:      svg("M3 7h18v12H3zM8 3l4 4 4-4"),
  home:    svg("M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"),
  router:  svg("M4 14h16v5H4zM8 16.5h.01M12 16.5h.01M7 10a7 7 0 0 1 10 0M9.5 12a3.5 3.5 0 0 1 5 0"),
  wifi:    svg("M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01"),
  wired:   svg("M5 9h14v8H5zM9 9V6h6v3M8 17v3M12 17v3M16 17v3"),
};
// best guess from what the router knows: name, Wi-Fi chip maker, wired or not, link speed and traffic.
// Returns [icon, type label, os label]; no guess when there are no clues.
function guess(d) {
  const n = (d.name || "").toLowerCase(), v = (d.vendor || "").toUpperCase(), wired = d.band === "wired";
  const os = /iphone|ipad|macbook|imac|mac-?mini|apple/.test(n) || v === "APPLE" ? "Apple"
    : /galaxy|redmi|xiaomi|poco|pixel|oneplus|oppo|vivo|realme|android|samsung|moto|nokia|^sm-/.test(n) ? "Android"
    : /^desktop-|^laptop-|windows|^win-/.test(n) ? "Windows" : "";
  if (wired) return /ap$|^ap|router|tenda|tp-?link|mesh|deco|^ac\d|switch/.test(n) ? ["router", "Router / access point", ""] : ["wired", "Wired device", os];
  if (/^wiz|bulb|lamp|light|plug|esp|tasmota|shelly|tuya|sonoff|camera|cam-/.test(n)) return ["home", "Smart home", ""];
  if (/tv|bravia|roku|fire-?stick|chromecast|mi-?box|webos|tizen|shield/.test(n)) return ["tv", "TV", os];
  if (/ipad|tab|pad/.test(n)) return ["tablet", "Tablet", os];
  if (/iphone|galaxy|redmi|note|pixel|oneplus|oppo|vivo|realme|poco|phone|^sm-|s\d{2}/.test(n)) return ["phone", "Phone", os || "Android"];
  if (/macbook|laptop|book|thinkpad|^desktop-|pc$/.test(n)) return ["laptop", "Computer", os];
  if (d.band === "2.4 GHz" && parseFloat(d.rate) <= 72.2 && (d.down_total || 0) < 5e6) return ["home", "Smart home (likely)", ""];
  if (v === "APPLE") return ["wifi", "Apple device", "Apple"];
  return ["wifi", "", os];
}
const open = new Set();
const mbps = b => (b * 8 / 1e6).toFixed(1);
const size = b => b >= 1e9 ? (b / 1e9).toFixed(2) + " GB" : b >= 1e6 ? Math.round(b / 1e6) + " MB" : Math.round(b / 1e3) + " KB";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const since = s => { const h = /(\d+) hr/.exec(s), m = /(\d+) min/.exec(s), x = /(\d+) sec/.exec(s);
  return h ? h[1] + "h " + (m ? m[1] : 0) + "m" : m ? m[1] + "m" : x ? x[1] + "s" : ""; };
const signal = r => r >= 45 ? ["Strong signal", ""] : r >= 35 ? ["Good signal", ""] : r >= 25 ? ["Fair signal", ""] : ["Weak signal", "warn"];
const label = d => d.name || (d.vendor && !/^(UNKNOWN|--)$/.test(d.vendor) ? d.vendor[0] + d.vendor.slice(1).toLowerCase() + " device" : "Unknown device") + (d.name ? "" : " · " + d.mac.slice(-4));

async function refresh() {
  if (document.hidden) return;
  let d;
  try { d = (await api("devices")).devices || []; } catch { $("line").textContent = "Can't reach the router right now"; $("line").className = "err"; return; }
  d.sort((a, b) => (b.down || 0) + (b.up || 0) - (a.down || 0) - (a.up || 0) || (b.down_total || 0) - (a.down_total || 0));
  const sum = k => d.reduce((s, x) => s + (x[k] || 0), 0);
  $("line").className = "";
  $("line").textContent = `${d.length} online · ${mbps(sum("down"))} down · ${mbps(sum("up"))} up, Mbps`;
  if (!d.length) { $("list").innerHTML = '<p class="empty">No devices are connected right now.</p>'; return; }
  $("list").innerHTML = d.map(x => {
    const wired = x.band === "wired", [sig, sc] = wired ? ["", ""] : signal(x.rssi), g = guess(x);
    const row = `<button class="row tap" data-mac="${x.mac}" aria-expanded="${open.has(x.mac)}">
      <span class="well" title="${esc(g[1] || "Unknown type")}">${ICON[g[0]]}</span>
      <span class="tx"><b>${esc(label(x))}</b><small>${[g[1] && g[1] !== "Apple device" ? g[1] : "", g[2]].filter(Boolean).map(esc).join(" · ")}${g[1] && g[1] !== "Apple device" || g[2] ? " · " : ""}${wired ? esc(x.ip) : `${esc(x.band)} · <span class="${sc}">${sig}</span> · ${since(x.since)}`}</small></span>
      ${wired ? '<span class="end"><small>Wired</small></span>' : `<span class="end"><span class="dn">${mbps(x.down)} down</span><small>${mbps(x.up)} up, Mbps</small></span>`}
    </button>`;
    const more = open.has(x.mac) && !wired ? `<div class="detail">${size(x.down_total)} down · ${size(x.up_total)} up since joining<br>IP ${esc(x.ip || "unknown")} · link ${esc(x.rate)} Mbps${x.vendor && !/^(UNKNOWN|--)$/.test(x.vendor) ? " · " + esc(x.vendor[0] + x.vendor.slice(1).toLowerCase()) : ""}</div>` : "";
    return row + more;
  }).join("");
  for (const b of $("list").querySelectorAll(".row")) b.onclick = () => { open.has(b.dataset.mac) ? open.delete(b.dataset.mac) : open.add(b.dataset.mac); refresh(); };
}
refresh();
setInterval(refresh, 3000);
document.addEventListener("visibilitychange", refresh);
</script>
</body>
</html>
